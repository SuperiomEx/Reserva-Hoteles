<div class="login-container">
  <mat-card class="login-card">
    <mat-card-header>
      <mat-card-title class="login-title">
        <mat-icon class="login-icon">hotel</mat-icon>
        Sistema de Gestión Hotelera
      </mat-card-title>
      <mat-card-subtitle>Iniciar Sesión</mat-card-subtitle>
    </mat-card-header>

    <mat-card-content>
      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="login-form">
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Usuario</mat-label>
          <input matInput 
                 type="text" 
                 formControlName="username" 
                 placeholder="Ingrese su usuario"
                 [class.is-invalid]="loginForm.get('username')?.invalid && loginForm.get('username')?.touched">
          <mat-icon matSuffix>person</mat-icon>
          <mat-error *ngIf="loginForm.get('username')?.invalid && loginForm.get('username')?.touched">
            {{ getErrorMessage('username') }}
          </mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Contraseña</mat-label>
          <input matInput 
                 [type]="hide ? 'password' : 'text'" 
                 formControlName="password"
                 placeholder="Ingrese su contraseña"
                 [class.is-invalid]="loginForm.get('password')?.invalid && loginForm.get('password')?.touched">
          <button mat-icon-button 
                  matSuffix 
                  type="button"
                  (click)="hide = !hide" 
                  [attr.aria-label]="'Hide password'" 
                  [attr.aria-pressed]="hide">
            <mat-icon>{{hide ? 'visibility_off' : 'visibility'}}</mat-icon>
          </button>
          <mat-error *ngIf="loginForm.get('password')?.invalid && loginForm.get('password')?.touched">
            {{ getErrorMessage('password') }}
          </mat-error>
        </mat-form-field>

        <button mat-raised-button 
                color="primary" 
                type="submit" 
                class="login-button full-width"
                [disabled]="loading">
          <mat-spinner diameter="20" *ngIf="loading" class="button-spinner"></mat-spinner>
          <span *ngIf="!loading">Iniciar Sesión</span>
          <span *ngIf="loading">Iniciando...</span>
        </button>
      </form>
    </mat-card-content>

    <mat-card-actions align="end">
      <p class="register-link">
        ¿No tienes cuenta? 
        <a routerLink="/register" mat-button color="accent">Regístrate aquí</a>
      </p>
    </mat-card-actions>
  </mat-card>
</div>
